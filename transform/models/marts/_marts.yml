version: 2

models:
  - name: dim_artists
    description: Un artiste par ligne avec identifiants externes, bio Discogs et position dans le crawl.
    columns:
      - name: artist_mbid
        data_tests: [unique, not_null]
      - name: perimeter
        description: >
          core (seeds et artistes reliés par MusicBrainz / Wikidata), label (artiste d'un label de la
          scène, jamais étendu) ou out (hors périmètre, gardé en base). Recalculé par --rescope.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["core", "label", "out"]
      - name: in_perimeter
        description: Faux pour les artistes hors périmètre, que l'app masque par défaut.
        data_tests: [not_null]
      - name: crawl_depth
        description: Distance (en sauts) depuis l'artiste de départ le plus proche.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: discogs_artist_id
        data_tests:
          - unique:
              config:
                severity: warn  # deux MBID vers un même Discogs = doublon probable à corriger

  - name: edges_artists
    description: >
      Arêtes du graphe artiste → artiste. Chaque arête porte sa source (musicbrainz, wikidata, llm)
      pour qu'on sache toujours d'où vient une affirmation. Les arêtes llm citent la phrase de la bio
      qui les justifie (evidence) et portent la confiance donnée par le LLM.
    columns:
      - name: from_artist_mbid
        data_tests: [not_null]
      - name: to_artist_mbid
        data_tests: [not_null]
      - name: edge_type
        data_tests: [not_null]
      - name: source_system
        data_tests:
          - accepted_values:
              arguments:
                values: ["musicbrainz", "wikidata", "llm"]
      - name: evidence_source
        description: Pour les arêtes llm, le texte cité (discogs = bio Discogs, wikipedia = article).
      - name: confidence
        description: Confiance du LLM entre 0 et 1 (null pour les sources non LLM).

  - name: bridge_artist_labels
    description: Artistes × labels, avec nombre de sorties et période d'activité.
    columns:
      - name: artist_mbid
        data_tests: [not_null]
      - name: label_mbid
        data_tests: [not_null]

  - name: dim_labels
    description: Un label par ligne avec son activité dans le périmètre crawlé.
    columns:
      - name: label_mbid
        data_tests: [unique, not_null]
      - name: n_releases_total
        description: >
          Nombre total de sorties du label dans MusicBrainz (null si le label n'a pas été exploré).
          Les colonnes *_in_scope ne comptent que les artistes crawlés.

  - name: fct_artist_releases
    description: >
      Une ligne par (artiste, sortie). is_self_released vaut true si MusicBrainz indique explicitement
      [no label] sans vrai label, false s'il y a au moins un vrai label, null si aucune info de label.
    columns:
      - name: artist_mbid
        data_tests: [not_null]
      - name: release_mbid
        data_tests: [not_null]
      - name: n_labels
        description: Nombre de vrais labels (hors [no label]).
        data_tests: [not_null]
      - name: is_self_released
        description: Autoproduction explicite ; null = inconnu.

  - name: llm_claims_to_review
    description: >
      Affirmations du LLM dont l'autre artiste n'a pas été rapproché d'un MBID unique : no_match (nom
      inconnu du crawl) ou ambiguous (homonymes, voir candidate_mbids). À revoir à la main.
    columns:
      - name: artist_mbid
        data_tests: [not_null]
      - name: match_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["no_match", "ambiguous"]
