name: lineage
version: "0.1.0"
config-version: 2
profile: lineage

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  lineage:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

vars:
  # Labels « spéciaux » de MusicBrainz qui ne sont pas de vrais labels.
  # [no label] = sortie autoproduite (https://musicbrainz.org/label/157afde4-4bf5-4039-8ad2-5a15acc85176).
  mb_placeholder_label_mbids: ["157afde4-4bf5-4039-8ad2-5a15acc85176"]
  # Version de l'extracteur LLM dont on garde les affirmations (= EXTRACTOR_VERSION dans
  # src/lineage/extract/run.py ; un test pytest vérifie qu'elles sont égales).
  llm_extractor_version: "2"
